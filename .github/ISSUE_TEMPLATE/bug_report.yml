name: Bug report
description: Report a reproducible extension problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste tokens, cookies, authorization codes, account identifiers, or client secrets.
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [OpenAI, Claude, Antigravity, Popup or shared runtime]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: 4.2.0
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Edge, Other Chromium browser]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use redacted values only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I ran `npm run verify`.
        - label: I removed all credentials and personal data from this report.
          required: true
