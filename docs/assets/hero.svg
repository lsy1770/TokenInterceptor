<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Token Interceptor</title>
  <desc id="desc">OpenAI, Claude and Antigravity OAuth token toolkit</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#30352d" stroke-width="1"/>
    </pattern>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#b7f34a"/>
      <stop offset=".5" stop-color="#ff7448"/>
      <stop offset="1" stop-color="#f3d451"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" fill="#0d0f0d"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity=".72"/>
  <path d="M0 382H1200" stroke="url(#beam)" stroke-width="6"/>
  <path d="M905 -50L1170 420M1010 -50L1200 288" stroke="#f3d451" stroke-opacity=".08" stroke-width="42"/>
  <g transform="translate(76 74)">
    <rect width="106" height="106" rx="5" fill="none" stroke="#687060" stroke-width="2"/>
    <rect x="10" y="10" width="41" height="86" rx="2" fill="#b7f34a"/>
    <rect x="55" y="10" width="41" height="86" rx="2" fill="#ff7448"/>
    <text x="30.5" y="67" text-anchor="middle" font-family="Bahnschrift, sans-serif" font-size="34" font-weight="800" fill="#11140e">O</text>
    <text x="75.5" y="67" text-anchor="middle" font-family="Bahnschrift, sans-serif" font-size="34" font-weight="800" fill="#160c08">C</text>
  </g>
  <g transform="translate(222 74)">
    <text x="0" y="18" font-family="Consolas, monospace" font-size="15" font-weight="700" letter-spacing="4" fill="#b7f34a">BROWSER OAUTH TOOLKIT</text>
    <text x="0" y="91" font-family="Bahnschrift, sans-serif" font-size="66" font-weight="800" letter-spacing="2" fill="#f0ecdf">TOKEN INTERCEPTOR</text>
    <text x="2" y="137" font-family="Consolas, monospace" font-size="20" letter-spacing="2" fill="#969d8e">OPENAI  /  CLAUDE  /  ANTIGRAVITY</text>
  </g>
  <g transform="translate(222 268)" font-family="Consolas, monospace" font-size="14" font-weight="700">
    <rect width="188" height="43" rx="2" fill="#b7f34a"/><text x="94" y="27" text-anchor="middle" fill="#11140e">PKCE + CALLBACK</text>
    <rect x="202" width="178" height="43" rx="2" fill="#ff7448"/><text x="291" y="27" text-anchor="middle" fill="#160c08">SESSION-ONLY</text>
    <rect x="394" width="194" height="43" rx="2" fill="#f3d451"/><text x="491" y="27" text-anchor="middle" fill="#171407">ZERO DEPS</text>
  </g>
  <g transform="translate(1003 92)" filter="url(#glow)">
    <circle cx="56" cy="56" r="55" fill="none" stroke="#f3d451" stroke-opacity=".3"/>
    <circle cx="56" cy="56" r="37" fill="none" stroke="#ff7448" stroke-opacity=".55"/>
    <circle cx="56" cy="56" r="7" fill="#b7f34a"/>
  </g>
</svg>
